[build-system]
# setuptools 75.4 and later require Python 3.9. With the floor of 80 that
# kolibri-opensearch-plugin uses, Python 3.8 has no backend for the editable
# build. Release 64 is the first with PEP 660 editable installs, and root
# Kolibri uses the same floor.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "django-vectors"
version = "0.0.1"
description = "Embedding storage and K-nearest-neighbor retrieval for Django on SQLite via sqlite-vec"
readme = "README.md"
# This uses the table form because the SPDX string form needs setuptools 77 or
# later, which requires Python 3.9.
license = {text = "MIT"}
# This floor matches root Kolibri, not the supported range in the classifiers
# below. Kolibri vendors its runtime dependencies with
# `uv pip install --python-version 3.6`, and that resolver rejects a higher
# floor. For the same reason, the code must stay importable on Python 3.6.
requires-python = ">=3.6, <3.15"
authors = [{ name = "Learning Equality", email = "info@learningequality.org" }]
keywords = ["django", "vectors", "embeddings", "sqlite-vec", "knn"]
# The classifiers list the supported Python versions. These are the versions in
# requires-python that are not end-of-life.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django==3.2.25",
]

[project.urls]
Homepage = "https://github.com/learningequality/kolibri"
Repository = "https://github.com/learningequality/kolibri"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek; python_version >= '3.8'",
]
lint = [
    "ruff",
]
# The test runners (pytest, pytest-django, and pytest-pythonpath) have no pins,
# so that the shared workspace lock resolves them to the versions that root
# Kolibri pins.
test = [
    "pytest",
    "pytest-django",
    "pytest-pythonpath; python_version < '3.14'",
    # Django 3.2 imports `cgi`, which Python 3.13 removed. Kolibri supplies its
    # own replacement (kolibri.utils.env.forward_port_cgi_module), so this is a
    # test dependency only.
    "legacy-cgi; python_version >= '3.13'",
    # sqlite-vec 0.1.9 has no sdist, and it has wheels only for the platforms in
    # this marker. Without the marker, `uv sync --all-packages` fails for Kolibri
    # developers on other platforms, for example Windows on ARM.
    "sqlite-vec==0.1.9; sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["django_vectors*"]

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["dist", "tmp*", ".git", ".*"]
# The test/ directory is not a package. On sys.path, it makes `settings` and
# `testapp` top-level modules. A `test.settings` module can be shadowed by the
# standard library `test` package, which the Ubuntu system Python includes, or
# by the root `test/` package of Kolibri. pytest-pythonpath reads python_paths
# for pytest 6. pytest 7 and later read pythonpath, and the lock selects pytest
# 9 on Python 3.14.
python_paths = ["test"]
pythonpath = ["test"]
DJANGO_SETTINGS_MODULE = "settings"
django_find_project = false
