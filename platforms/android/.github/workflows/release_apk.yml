name: Release Android App

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      version-code:
        description: 'The version code to promote to the open testing track'
        required: true
        type: string
  workflow_call:
    inputs:
      version-code:
        description: 'The version code to promote to the open testing track'
        required: true
        type: string
      ref:
        description: 'A ref for this workflow to check out its own repo'
        required: true
        type: string
    secrets:
      KOLIBRI_ANDROID_PLAY_STORE_API_SERVICE_ACCOUNT_JSON:
        required: false

jobs:
  release_apk:
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT_JSON: '${{ secrets.KOLIBRI_ANDROID_PLAY_STORE_API_SERVICE_ACCOUNT_JSON }}'
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.ref }}
      - uses: actions/checkout@v7
        if: ${{ inputs.ref }}
        with:
          repository: learningequality/kolibri-installer-android
          ref: ${{ inputs.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - name: Install dependencies
        run: uv sync --extra build
      - name: Release APK
        run: uv run python scripts/play_store_api.py release "${{ inputs.version-code }}"
