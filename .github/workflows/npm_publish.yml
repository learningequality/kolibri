name: Publish packages to npm

on:
  push:
    branches:
      - develop
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      npm_package:
        description: 'Package to publish (or "all" to auto-detect)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'browserslist-config-kolibri'
          - 'eslint-plugin-kolibri'
          - 'kolibri'
          - 'kolibri-app'
          - 'kolibri-build'
          - 'kolibri-format'
          - 'kolibri-glob'
          - 'kolibri-i18n'
          - 'kolibri-jest-config'
          - 'kolibri-logging'
          - 'kolibri-module'
          - 'kolibri-plugin-data'
          - 'kolibri-tools'
          - 'kolibri-viewer'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required for npm provenance attestation
      id-token: write  # Required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish to npm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.npm_package }}" != "all" ]; then
            ./scripts/npm_publish.sh "${{ github.event.inputs.npm_package }}"
          else
            ./scripts/npm_publish.sh
          fi
