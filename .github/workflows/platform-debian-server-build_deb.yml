name: Build kolibri-server DEB file
on:
  workflow_call:
    outputs:
      deb-file-name:
        description: "kolibri-server .deb file name"
        value: ${{ jobs.build_deb.outputs.deb-file-name }}
permissions:
  contents: read
jobs:
  build_deb:
    name: Build kolibri-server DEB file
    runs-on: ubuntu-latest
    outputs:
      deb-file-name: ${{ steps.get-deb-filename.outputs.deb-file-name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Install the workspace so kolibri resolves from it
        run: uv sync --all-packages
      - name: Install Debian build tooling
        working-directory: platforms/debian-server
        run: make install-build-deps
      - name: Build the .deb
        working-directory: platforms/debian-server
        # uv run: error-pages and the changelog generator use the workspace kolibri.
        # -d: skip the Debian build-dep check, since that kolibri isn't apt-installed.
        run: uv run make deb DPKG_BUILDPACKAGE_FLAGS=-d
      - name: Identify the built .deb
        id: get-deb-filename
        working-directory: platforms
        run: echo "deb-file-name=$(basename kolibri-server_*.deb)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-deb-filename.outputs.deb-file-name }}
          path: platforms/${{ steps.get-deb-filename.outputs.deb-file-name }}
