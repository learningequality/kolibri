name: npm Package Version Comment

on:
  workflow_run:
    workflows: [npm Package Version Check]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Find PR by head SHA
        id: find-pr
        uses: actions/github-script@v9
        with:
          script: |
            const utils = require('./.github/githubUtils.js')
            const prNumber = await utils.findPrByHeadSha(github, context)
            if (!prNumber) {
              core.notice('No open PR found for head SHA; skipping comment')
              core.setOutput('found', 'false')
              return null
            }
            core.setOutput('found', 'true')
            return prNumber
      - name: Download report artifact
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a => a.name === 'npm_version_report');
            if (!match) {
              core.setFailed('No npm_version_report artifact found');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            require('fs').writeFileSync('npm_version_report.zip', Buffer.from(download.data));
      - name: Unzip report
        if: steps.find-pr.outputs.found == 'true'
        run: unzip npm_version_report.zip
      - name: Post or update comment
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.find-pr.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const utils = require('./.github/githubUtils.js');
            const raw = fs.readFileSync('data.json', 'utf8');
            let data;
            try {
              data = utils.validateNpmVersionData(raw);
            } catch (e) {
              core.setFailed(`Invalid version data JSON: ${e.message}`);
              return;
            }
            const body = data ? utils.renderNpmVersionMarkdown(data) : null;
            const prNumber = Number(process.env.PR_NUMBER);
            await utils.postNpmVersionComment(github, context, prNumber, body);
