name: Pre-release Kolibri to kolibri-proposed PPA
on:
  workflow_dispatch:
    inputs:
      tar-url:
        description: 'URL for Kolibri tar file'
        required: true
      ubuntu-revision:
        description: 'Debian packaging revision (the N in -0ubuntuN); bump to re-release the same version after a packaging fix'
        required: false
        default: '1'
  workflow_call:
    inputs:
      tar-file-name:
        required: true
        type: string
      ubuntu-revision:
        description: 'Debian packaging revision (the N in -0ubuntuN)'
        required: false
        type: string
        default: '1'
    outputs:
      version:
        description: "Full Debian version string (e.g. 0.19.3-0ubuntu1)"
        value: ${{ jobs.build_source_and_upload.outputs.version }}
    secrets:
      GPG_SIGNING_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      LP_CREDENTIALS:
        required: true
permissions:
  contents: read
jobs:
  build_source_and_upload:
    name: Build, sign, and upload source package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/debian
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install Python dependencies for changelog generation
        run: uv sync --package kolibri-installer-debian
      - name: Download tarfile from URL
        if: ${{ inputs.tar-url }}
        env:
          TAR_URL: ${{ inputs.tar-url }}
        run: make get-tar tar="$TAR_URL"
      - name: Download tarfile from artifacts
        if: ${{ inputs.tar-file-name }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.tar-file-name }}
          path: platforms/debian/build_src
      - name: Install build and upload dependencies
        run: >-
          ../../.github/scripts/apt-install.sh devscripts debhelper python3-pip dput dh-python python3-all python3-pytest python3-launchpadlib python3-distro-info build-essential po-debconf python3-setuptools
      - name: Extract version
        id: version
        env:
          UBUNTU_REVISION: ${{ inputs.ubuntu-revision }}
        run: |
          uv run make dist/DEB_VERSION
          DEB_VERSION=$(cat dist/DEB_VERSION)
          FULL_VERSION="${DEB_VERSION}-0ubuntu${UBUNTU_REVISION}"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $FULL_VERSION"
      - name: Write Launchpad credentials
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
        run: echo "$LP_CREDENTIALS" > /tmp/lp-creds.txt
      - name: Check if source already uploaded
        id: check_source
        env:
          LP_CREDENTIALS_FILE: /tmp/lp-creds.txt
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          python3 scripts/launchpad_copy.py \
            --source-package kolibri-source --binary-package kolibri \
            check-source --version "$VERSION"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "already_uploaded=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "already_uploaded=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to check source package status"
            exit "$rc"
          fi
      - name: Configure GPG Key
        if: steps.check_source.outputs.already_uploaded != 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --import --no-tty --batch --yes
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
      - name: Build and upload source package
        if: steps.check_source.outputs.already_uploaded != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          UBUNTU_REVISION: ${{ inputs.ubuntu-revision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run make commit-new-release
      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/lp-creds.txt
  wait_for_source_published:
    name: Wait for source package builds
    needs: build_source_and_upload
    runs-on: ubuntu-latest
    # Past wait-for-published's own --timeout 14400 (4 h).
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: .github/scripts/apt-install.sh python3-launchpadlib python3-distro-info
      - name: Write Launchpad credentials
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
        run: echo "$LP_CREDENTIALS" > /tmp/lp-creds.txt
      - name: Wait for published binaries in source series
        working-directory: platforms/debian
        env:
          LP_CREDENTIALS_FILE: /tmp/lp-creds.txt
          VERSION: ${{ needs.build_source_and_upload.outputs.version }}
        run: |
          # No --series: discover the series the source was actually uploaded
          # to (the current LTS), rather than assuming the runner's own series.
          python3 scripts/launchpad_copy.py \
            --source-package kolibri-source --binary-package kolibri \
            wait-for-published --version "$VERSION" \
            --timeout 14400 \
            --interval 600
      - name: Cleanup Launchpad credentials
        if: always()
        run: rm -f /tmp/lp-creds.txt
  copy_to_other_series:
    name: Copy to all supported Ubuntu series
    needs:
      - build_source_and_upload
      - wait_for_source_published
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: .github/scripts/apt-install.sh python3-launchpadlib python3-distro-info
      - name: Write Launchpad credentials
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
        run: echo "$LP_CREDENTIALS" > /tmp/lp-creds.txt
      - name: Copy to other supported series
        working-directory: platforms/debian
        env:
          LP_CREDENTIALS_FILE: /tmp/lp-creds.txt
        run: |
          python3 scripts/launchpad_copy.py \
            --source-package kolibri-source --binary-package kolibri \
            copy-to-series
      - name: Cleanup Launchpad credentials
        if: always()
        run: rm -f /tmp/lp-creds.txt
  wait_for_copies_published:
    name: Wait for all series builds
    needs:
      - build_source_and_upload
      - copy_to_other_series
    runs-on: ubuntu-latest
    # Past wait-for-published's own --timeout 14400 (4 h).
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install dependencies
        run: .github/scripts/apt-install.sh python3-launchpadlib python3-distro-info
      - name: Write Launchpad credentials
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
        run: echo "$LP_CREDENTIALS" > /tmp/lp-creds.txt
      - name: Wait for all builds to complete
        working-directory: platforms/debian
        env:
          LP_CREDENTIALS_FILE: /tmp/lp-creds.txt
          VERSION: ${{ needs.build_source_and_upload.outputs.version }}
        run: |
          python3 scripts/launchpad_copy.py \
            --source-package kolibri-source --binary-package kolibri \
            wait-for-published --version "$VERSION" \
            --timeout 14400 \
            --interval 600
      - name: Cleanup Launchpad credentials
        if: always()
        run: rm -f /tmp/lp-creds.txt
