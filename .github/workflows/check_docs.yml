name: Docs
on:
  push:
    branches:
      - develop
      - 'release-v**'
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/check_docs.yml'
      - '*.md'
  pull_request:
    branches:
      - develop
      - 'release-v**'
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/check_docs.yml'
      - '*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Skips setuptools_scm's `git archive` file listing; see Makefile.
  SETUPTOOLS_SCM_IGNORE_VCS_ROOTS: ${{ github.workspace }}
jobs:
  docs:
    name: Checking docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-python: true
          # Pin to match the Python RTD builds docs with (.readthedocs.yaml)
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group docs
      - name: Check Docs build
        run: make docs
