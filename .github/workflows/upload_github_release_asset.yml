name: Upload Release Asset to GitHub Release
on:
  workflow_call:
    inputs:
      filename:
        required: true
        type: string
      release_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  github_upload:
    name: Upload to Github release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download ${{ inputs.filename }} artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.filename }}
          path: dist
      - uses: actions/github-script@v9
        env:
          ASSET_FILENAME: ${{ inputs.filename }}
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const utils = require('./.github/githubUtils.js')
            await utils.uploadReleaseAsset(github, context, `dist/${process.env.ASSET_FILENAME}`, process.env.RELEASE_ID)
