name: Publish to the self-hosted APT repo
on:
  workflow_dispatch:
    inputs:
      deb-url:
        description: 'URL for the .deb file to publish'
        required: true
  workflow_call:
    inputs:
      deb-artifact-name:
        description: "Name of the uploaded .deb artifact to publish"
        required: true
        type: string
    secrets:
      DEBIAN_REPO_SIGNING_KEY:
        required: true
      GH_UPLOADER_GCP_SA_CREDENTIALS:
        required: true
      KOLIBRI_PUBLIC_RELEASE_GCS_BUCKET:
        required: true
permissions:
  contents: read
jobs:
  publish:
    name: Read-modify-write the reprepro repo on the release bucket
    runs-on: ubuntu-latest
    # A publish is a read-modify-write against shared bucket state, so it must
    # never run concurrently with another publish nor be cancelled mid-write.
    concurrency:
      group: apt-repo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      # Exactly one of these runs: a workflow_call only has deb-artifact-name,
      # a manual dispatch only has deb-url.
      - name: Download the .deb from artifacts
        if: ${{ inputs.deb-artifact-name }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.deb-artifact-name }}
          path: dist
      - name: Download the .deb from URL
        if: ${{ inputs.deb-url }}
        env:
          DEB_URL: ${{ inputs.deb-url }}
        run: curl -fsSL --create-dirs --output-dir dist --remote-name "$DEB_URL"
      - name: Install reprepro and Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro dpkg-dev debhelper build-essential
      - name: Import the Debian repo signing key
        id: gpg
        run: |
          # Same key, keyring layout and loopback pinentry as the release_ppa
          # workflow in learningequality/kolibri-installer-debian, which publishes
          # the Pages repos this one replaces.
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "${{ secrets.DEBIAN_REPO_SIGNING_KEY }}" | gpg --batch --import
          # The repo must be signed by the key kolibri-archive-keyring ships, or no
          # client trusting that keyring can verify it. Take the key id from the
          # committed key and require the imported secret key to match.
          GPG_KEY_ID=$(gpg --show-keys --with-colons platforms/apt-repo/keyring/kolibri-archive-keyring.asc | awk -F: '/^fpr:/ {print $10; exit}')
          gpg --list-secret-keys "$GPG_KEY_ID" >/dev/null 2>&1 || {
            echo "::error::DEBIAN_REPO_SIGNING_KEY does not hold $GPG_KEY_ID, the key shipped in kolibri-archive-keyring.asc"
            exit 1
          }
          echo "$GPG_KEY_ID:6:" | gpg --batch --import-ownertrust
          echo "key-id=$GPG_KEY_ID" >> "$GITHUB_OUTPUT"
      - uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GH_UPLOADER_GCP_SA_CREDENTIALS }}"
      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v3"
      - name: Build the kolibri-archive-keyring package
        # Serves the version-less kolibri-archive-keyring.deb at the repo root
        # (via publish.sh's KOLIBRI_KEYRING_DEB hook) so the new-user
        # `curl .../kolibri-archive-keyring.deb` bootstrap resolves.
        working-directory: platforms/apt-repo/keyring
        run: dpkg-buildpackage -b -us -uc
      - name: Publish the .deb into the reprepro repo
        env:
          KOLIBRI_APT_BUCKET: ${{ secrets.KOLIBRI_PUBLIC_RELEASE_GCS_BUCKET }}
          REPREPRO_SIGN_KEY: ${{ steps.gpg.outputs.key-id }}
        run: |
          KOLIBRI_KEYRING_DEB=$(ls "$GITHUB_WORKSPACE"/platforms/apt-repo/kolibri-archive-keyring_*.deb)
          export KOLIBRI_KEYRING_DEB
          bash platforms/apt-repo/publish.sh dist/*.deb
      - name: Clean up GPG material
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
