name: Publish to the self-hosted APT repo
on:
  workflow_dispatch:
    inputs:
      deb-url:
        description: 'Space-separated URLs of the .deb files to publish'
        required: true
  workflow_call:
    inputs:
      deb-artifact-pattern:
        description: "Glob over uploaded artifact names; every match is published in one read-modify-write"
        required: true
        type: string
    secrets:
      DEBIAN_REPO_SIGNING_KEY:
        required: true
      GH_UPLOADER_GCP_SA_CREDENTIALS:
        required: true
      KOLIBRI_PUBLIC_RELEASE_GCS_BUCKET:
        required: true
    outputs:
      packages:
        description: "Space-separated Package=Version of the published .debs, for platform-apt-repo-promote.yml"
        value: ${{ jobs.publish.outputs.packages }}
permissions:
  contents: read
jobs:
  publish:
    name: Read-modify-write the reprepro repo on the release bucket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    # A publish is a read-modify-write against shared bucket state, so it must
    # never run concurrently with another publish nor be cancelled mid-write.
    concurrency:
      group: apt-repo-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      # Exactly one of these runs: a workflow_call only has deb-artifact-pattern,
      # a manual dispatch only has deb-url.
      - name: Download the .debs from artifacts
        if: ${{ inputs.deb-artifact-pattern }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.deb-artifact-pattern }}
          merge-multiple: true
          path: dist
      - name: Download the .debs from URL
        if: ${{ inputs.deb-url }}
        env:
          DEB_URLS: ${{ inputs.deb-url }}
        run: |
          read -ra urls <<< "$DEB_URLS"
          for url in "${urls[@]}"; do
            curl -fsSL --create-dirs --output-dir dist --remote-name "$url"
          done
      - name: Install reprepro
        run: .github/scripts/apt-install.sh reprepro
      - name: List the published package versions
        id: packages
        run: |
          packages=$(for deb in dist/*.deb; do
            echo "$(dpkg-deb -f "$deb" Package)=$(dpkg-deb -f "$deb" Version)"
          done | paste -sd' ')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Import the Debian repo signing key
        id: gpg
        env:
          DEBIAN_REPO_SIGNING_KEY: ${{ secrets.DEBIAN_REPO_SIGNING_KEY }}
        run: .github/scripts/import-apt-repo-signing-key.sh
      - uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GH_UPLOADER_GCP_SA_CREDENTIALS }}"
      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v3"
      - name: Publish the .deb into the reprepro repo
        env:
          KOLIBRI_APT_BUCKET: ${{ secrets.KOLIBRI_PUBLIC_RELEASE_GCS_BUCKET }}
          REPREPRO_SIGN_KEY: ${{ steps.gpg.outputs.key-id }}
        run: bash platforms/apt-repo/publish.sh dist/*.deb
      - name: Clean up GPG material
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
