name: Release to Flathub
on:
  workflow_call:
    inputs: &workflow_inputs
      release-tag:
        description: 'Kolibri release tag (manifest source + kolibri-gnome pin)'
        required: true
        type: string
      whl-url:
        description: 'URL of the released Kolibri wheel to pin'
        required: true
        type: string
      stable:
        description: 'true → flathub master (stable); false → flathub beta (pre-release)'
        required: false
        type: boolean
        default: false
    secrets:
      LEQ_BOT_CLASSIC_PAT:
        # Classic PAT of the LEQ bot user, not a token scoped to this release:
        # opening a fork -> flathub PR needs a credential that acts across both
        # the learningequality fork and the flathub parent, which only a classic
        # (user-wide) PAT can do. A GitHub App token can't — the app can't be
        # installed on the flathub org, so it could never open the parent PR.
        required: true
  workflow_dispatch:
    inputs: *workflow_inputs
permissions:
  contents: read
jobs:
  release_flathub:
    name: Open Flathub PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      WHL_URL: ${{ inputs.whl-url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-tag }}
      - name: Render the wheel pin (url + sha256)
        run: ./platforms/flatpak-app/build-aux/flatpak/prepare-kolibri-module.py --url "$WHL_URL" --pin
      - name: Checkout the flathub repo (PR parent)
        uses: actions/checkout@v7.0.1
        with:
          repository: flathub/org.learningequality.Kolibri
          token: ${{ secrets.LEQ_BOT_CLASSIC_PAT }}
          ref: ${{ inputs.stable && 'master' || 'beta' }}
          path: flathub
          persist-credentials: false
      - name: Sync canonical files + pin the release tag
        run: ./platforms/flatpak-app/build-aux/flatpak/sync-flathub.py flathub "$RELEASE_TAG"
      - name: Open the PR from the learningequality fork
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.LEQ_BOT_CLASSIC_PAT }}
          path: flathub
          push-to-fork: learningequality/org.learningequality.Kolibri
          base: ${{ inputs.stable && 'master' || 'beta' }}
          branch: update-kolibri-${{ inputs.release-tag }}
          title: "Update Kolibri (${{ inputs.release-tag }})"
          commit-message: "Update Kolibri to ${{ inputs.release-tag }}"
          body: |
            Automated update from learningequality/kolibri.
            Release tag: ${{ inputs.release-tag }}
            Kolibri wheel: ${{ inputs.whl-url }}
