show-openssf-scorecard: false
allow-licenses:
  - MIT
  - MIT-0
  - 0BSD
  - BSD-2-Clause
  - BSD-2-Clause-FreeBSD
  - BSD-2-Clause-Views
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - Zlib
  - Unlicense
  - CC0-1.0
  - BlueOak-1.0.0
  - Python-2.0
  - Python-2.0.1
  - PSF-2.0
  - ZPL-2.1
  - HPND-Markus-Kuhn
  - WTFPL
  - MPL-2.0
  - LGPL-2.0-only
  - LGPL-2.0-or-later
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - CC-BY-3.0
  - CC-BY-4.0
  - OFL-1.1
allow-dependencies-licenses:
  # LGPL-2.0 on PyPI; ClearlyDefined says GPL-3.0-or-later
  - pkg:pypi/zeroconf-py2compat
  # LGPL on PyPI; ClearlyDefined says GPL-3.0-or-later
  - pkg:pypi/json-schema-validator
  # wxWindows Library Licence 3.1 (LGPL-2.0-or-later WITH WxWindows-exception-3.1)
  - pkg:pypi/wxpython
  # PSF-2.0
  - pkg:pypi/typing-extensions
  # BSD-3-Clause
  - pkg:pypi/protobuf
  # BSD-2-Clause
  - pkg:pypi/wrapt
  # MIT
  - pkg:pypi/le-utils
  # MIT
  - pkg:npm/nan
  # GPL-2.0; desktop-app build tool, not shipped
  - pkg:pypi/pyinstaller
  # GPL-2.0 / Apache-2.0; desktop-app build tool, not shipped
  - pkg:pypi/pyinstaller-hooks-contrib
  # Artistic OR GPL; test-only via mixer -> faker
  - pkg:pypi/text-unidecode
  # JSON license term; lint tooling via parse-imports-exports
  - pkg:npm/parse-statements
  # MIT, with a stray Unicode LicenseRef; Babel build tooling
  - pkg:npm/unicode-match-property-value-ecmascript
  # MIT; catalog: manifest entries reported as LicenseRef-bad-see-license-in-license
  - pkg:npm/core-js
